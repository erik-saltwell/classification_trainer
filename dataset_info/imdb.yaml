# HuggingFace dataset repository name.
# The dataset must be accessible via the huggingface_hub library.
# Example: for "stanfordnlp/imdb" this would be "imdb"
dataset_name: "imdb"

# HuggingFace user who owns the dataset.
# The user dataset must own the dataset named in datset_name in the huggingface_hub library.
# Example: for "stanfordnlp/imdb" this would be "stanfordnlp"
hugging_face_user_name: "stanfordnlp"

content_column_name: "text"
label_column_name: "label"
new_column_prefix: "tmp_"
training_split_name: "train"
max_rowcount: 100
positive_case: "pos"
case_invariant_comparison: true
search_length: -1
search_from_end: false
potential_sequence_lengths: [1024, 1536, 2048]
